name: build-x86_64-aplus-gcc-linux-amd64

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
        
    - name: Install Dependencies
      working-directory: ${{github.workspace}}
      shell: bash
      run: sudo apt update && sudo apt install -y --no-install-recommends build-essential gcc g++ automake autoconf texinfo flex bison
      
    - name: Build Musl
      working-directory: ${{github.workspace}}
      shell: bash
      run: ./ci/release.sh x86_64-aplus x86_64-linux-gnu
      
    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        files: |
          ${{github.workspace}}/*-aplus-musl-*.tar.xz
